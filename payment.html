                    <label class="radio">
                        <input type="radio" name="method" value="Card"> <b>Credit / Debit Card</b>
                    </label>
                    <label class="radio"><input type="radio" name="method" value="Net Banking"> <b>Net Banking</b></label>
                    <label class="radio"><input type="radio" name="method" value="Cash on Delivery"> <b>Cash on Delivery</b>
                    </label>
                </div>
                <div class="notice">Select an online payment option to get paid faster   <i class='bx bxl-visa'></i>  <i class='bx bxl-mastercard'></i>  Payment Gateway</div>
                <button class="btn btn-gold" style="width:100%;margin-top:20px">Pay Now</button>
            </form>
